# =============================================================================
# Staging overlay — thinner replicas, smaller envelope, staging hostnames
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bossnyumba-staging

resources:
  - ../../namespaces/bossnyumba-staging.yaml
  - ../../base

# Image tags pinned by the CD workflow via `kustomize edit set image`.
images:
  - { name: ghcr.io/georgemwiki/bossnyumba-api-gateway,           newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-consolidation-worker,  newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-mcp-process-intel,     newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-mcp-nin,               newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-mcp-firs,              newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-mcp-nggis,             newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-mcp-opay,              newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-document-intelligence, newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-domain-services,       newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-identity,              newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-notifications,         newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-payments,              newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-reports,               newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-webhooks,              newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-customer-app,          newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-owner-portal,          newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-admin-platform-portal, newTag: staging }
  - { name: ghcr.io/georgemwiki/bossnyumba-estate-manager-app,    newTag: staging }

# ---- Replica counts ---------------------------------------------------------
# Each entry references the shared one-op JSON-Patch in patches/replica-1.yaml
# and targets a different Deployment.
patches:
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: api-gateway }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: customer-app }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: owner-portal }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: admin-platform-portal }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: estate-manager-app }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: document-intelligence }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: domain-services }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: identity }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: notifications }
  - path: patches/replica-1.yaml
    target: { kind: Deployment, name: payments }
  - path: patches/hpa-staging.yaml
    target: { kind: HorizontalPodAutoscaler, name: api-gateway }
  - path: patches/pdb-staging.yaml
    target: { kind: PodDisruptionBudget, name: api-gateway }
  - path: patches/api-gateway-resources.yaml
    target: { kind: Deployment, name: api-gateway }
  - path: patches/postgres-resources.yaml
    target: { kind: StatefulSet, name: postgres }
  - path: patches/ingress-hosts.yaml
    target: { kind: Ingress, name: bossnyumba }

configMapGenerator:
  - name: bossnyumba-config
    behavior: merge
    literals:
      - SENTRY_ENVIRONMENT=staging
      - API_URL=https://staging-api.bossnyumba.com
      - FRONTEND_URL=https://staging.bossnyumba.com
      - CORS_ALLOWED_ORIGINS=https://staging.bossnyumba.com,https://staging-admin.bossnyumba.com,https://staging-owners.bossnyumba.com,https://staging-manage.bossnyumba.com
  - name: bossnyumba-public-config
    behavior: merge
    literals:
      - NEXT_PUBLIC_API_URL=https://staging-api.bossnyumba.com/api/v1
      - VITE_API_URL=https://staging-api.bossnyumba.com/api/v1
