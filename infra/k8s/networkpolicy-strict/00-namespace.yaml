---
# BOSSNYUMBA strict-isolation namespace. Apply this BEFORE the
# NetworkPolicy manifests so the policy controllers can find the
# pods they govern.
apiVersion: v1
kind: Namespace
metadata:
  name: bossnyumba
  labels:
    name: bossnyumba
    app.kubernetes.io/name: bossnyumba
    app.kubernetes.io/managed-by: helm
