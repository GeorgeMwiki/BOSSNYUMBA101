apiVersion: v1
kind: ConfigMap
metadata:
  name: bossnyumba-config
  labels: { app.kubernetes.io/part-of: bossnyumba }
data:
  # Non-secret runtime config — secrets live in `bossnyumba-secrets`.
  NODE_ENV: production
  LOG_LEVEL: info
  TZ: UTC
  AWS_REGION: eu-west-1
  AI_PROVIDER: anthropic
  CONSOLIDATION_INTERVAL_MS: "3600000"
  BOSSNYUMBA_PII_EXTENDED: "1"
  SENTRY_ENVIRONMENT: production
  POSTHOG_HOST: https://eu.posthog.com
  OTEL_SERVICE_NAME: bossnyumba
  CORS_ALLOWED_ORIGINS: https://bossnyumba.com,https://admin.bossnyumba.com,https://owners.bossnyumba.com,https://manage.bossnyumba.com
  API_URL: https://api.bossnyumba.com
  FRONTEND_URL: https://bossnyumba.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bossnyumba-public-config
  labels: { app.kubernetes.io/part-of: bossnyumba }
data:
  # Only NEXT_PUBLIC_* / VITE_* — safe for browser bundles.
  NEXT_PUBLIC_API_URL: https://api.bossnyumba.com/api/v1
  NEXT_PUBLIC_SENTRY_DSN: ""
  NEXT_PUBLIC_POSTHOG_KEY: ""
  VITE_API_URL: https://api.bossnyumba.com/api/v1
