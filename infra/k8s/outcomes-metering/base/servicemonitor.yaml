# Prometheus Operator ServiceMonitor — scrape /metrics on the metrics port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: outcomes-metering
  labels:
    app.kubernetes.io/name: outcomes-metering
    app.kubernetes.io/part-of: bossnyumba
    # Standard label used by Prometheus Operator to discover monitors.
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: outcomes-metering
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - bossnyumba-app
      - bossnyumba-staging
      - bossnyumba-prod
