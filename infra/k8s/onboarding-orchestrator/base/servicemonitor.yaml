apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: onboarding-orchestrator
  labels:
    app.kubernetes.io/name: onboarding-orchestrator
    app.kubernetes.io/part-of: bossnyumba
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: onboarding-orchestrator
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - bossnyumba-app
      - bossnyumba-staging
      - bossnyumba-prod
