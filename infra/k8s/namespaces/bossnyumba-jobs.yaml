apiVersion: v1
kind: Namespace
metadata:
  name: bossnyumba-jobs
  labels:
    app.kubernetes.io/part-of: bossnyumba
    environment: production
    # Pod Security Standards — restricted profile (no privileged, runAsNonRoot)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    bossnyumba.com/managed-by: kustomize
    bossnyumba.com/runbook: docs/deployment/README.md
    bossnyumba.com/purpose: scheduled-jobs-and-batch-workers
