name: bossnyumba_core
description: >
  Shared core library for BOSSNYUMBA mobile apps — offline sync engine,
  biometric auth, JWT/tenant session management, Drift database, RBAC
  policy, and geospatial helpers.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client with interceptors
  dio: ^5.7.0

  # Local database (type-safe SQLite ORM)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.4.0

  # Encrypted SQLite (AES-256 via SQLCipher)
  sqlcipher_flutter_libs: ^0.6.0

  # Secure token/credential storage
  flutter_secure_storage: ^9.2.0

  # Biometric authentication
  local_auth: ^2.3.0

  # Network connectivity monitoring
  connectivity_plus: ^6.1.0

  # State management
  flutter_riverpod: ^2.6.0

  # UUID generation
  uuid: ^4.5.0

  # Logging
  logger: ^2.5.0

  # Path utilities
  path_provider: ^2.1.0
  path: ^1.9.0

  # Device info (for device registration)
  device_info_plus: ^11.2.0

  # Package info (app version)
  package_info_plus: ^8.1.0

  # Crypto (SHA-256 for enrollment token hashing, JWT verification helpers)
  crypto: ^3.0.0

  # JWT parsing (extract tenant_id claim)
  dart_jsonwebtoken: ^2.14.0

  # HTTP (for /api/health pings; Dio for app traffic)
  http: ^1.2.0

  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0

  # Immutable data models (code generation) — annotations only
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  drift_dev: ^2.22.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.0
  fake_async: ^1.3.1
