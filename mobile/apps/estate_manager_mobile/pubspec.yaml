name: estate_manager_mobile
description: >
  BOSSNYUMBA Estate Manager Mobile App — field inspections, photo
  capture with RAG-assisted form fill, maintenance triage, and
  biometric tenant lease sign-off.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  bossnyumba_core:
    path: ../../packages/bossnyumba_core
  bossnyumba_ui:
    path: ../../packages/bossnyumba_ui

  # Navigation
  go_router: ^14.6.0

  # State management
  flutter_riverpod: ^2.6.0

  # Google Maps for property pin-drops + inspection routes
  google_maps_flutter: ^2.10.0

  # High-accuracy GPS (within 50m for inspection check-in)
  geolocator: ^13.0.0

  # Camera + image picking + compression for inspection photos
  image_picker: ^1.1.0
  camera: ^0.11.0
  flutter_image_compress: ^2.3.0

  # Cached images
  cached_network_image: ^3.4.0

  # Push notifications (assignment alerts)
  firebase_messaging: ^15.1.0
  firebase_core: ^3.6.0

  # Markdown rendering (inspection notes)
  flutter_markdown: ^0.7.0

  # Shimmer loaders
  shimmer: ^3.0.0

  # Currency / date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
