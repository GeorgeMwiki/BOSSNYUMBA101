<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="192" height="192">
  <!-- BossNyumba favicon / app icon — the doorway-B on a dark tile.
       Pixel-parity with <BossNyumbaMark tone="full" withBackdrop />. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F160E"/>
      <stop offset="100%" stop-color="#0E0906"/>
    </linearGradient>
    <linearGradient id="spine" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE2B4"/><stop offset="40%" stop-color="#F2C27E"/><stop offset="100%" stop-color="#A26A2A"/>
    </linearGradient>
    <linearGradient id="upper" x1="32" y1="14" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF1CF"/><stop offset="100%" stop-color="#E5B26B"/>
    </linearGradient>
    <linearGradient id="lower" x1="32" y1="34" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2C27E"/><stop offset="100%" stop-color="#7A4F1E"/>
    </linearGradient>
    <linearGradient id="hi" x1="32" y1="10" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E6" stop-opacity="0.85"/><stop offset="100%" stop-color="#FFF8E6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="32" cy="30" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7CC85" stop-opacity="0.3"/><stop offset="60%" stop-color="#E5B26B" stop-opacity="0.05"/><stop offset="100%" stop-color="#E5B26B" stop-opacity="0"/>
    </radialGradient>
