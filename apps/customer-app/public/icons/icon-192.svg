  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <rect width="64" height="64" rx="12" fill="none" stroke="#2A1E10" stroke-width="0.5"/>
  <circle cx="32" cy="30" r="19" fill="url(#bloom)"/>
  <rect x="14" y="12" width="8" height="40" rx="2" fill="url(#spine)"/>
  <path d="M22 14 H38 a8 8 0 0 1 8 8 v3 a8 8 0 0 1 -8 8 H22 z" fill="url(#upper)"/>
  <rect x="22" y="32" width="20" height="1.2" fill="#E5B26B" opacity="0.9"/>
  <path fill-rule="evenodd" clip-rule="evenodd" d="M22 35 H40 a10 10 0 0 1 10 10 a10 10 0 0 1 -10 10 H22 Z M31.6 55 V49 a3.9 3.9 0 0 1 7.8 0 V55 Z" fill="url(#lower)"/>
  <rect x="14.4" y="12.4" width="7.2" height="6" rx="1.6" fill="url(#hi)"/>
  <path d="M31.6 55 V49 a3.9 3.9 0 0 1 7.8 0 V55" fill="none" stroke="#FFE2B4" stroke-width="0.5" opacity="0.4"/>
