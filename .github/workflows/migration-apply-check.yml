# =============================================================================
# Migration Apply Check — every migration must apply cleanly on a fresh DB
# =============================================================================
#
# Installs an ephemeral PostgreSQL 17 cluster WITH PostGIS and pgvector, then
# applies every *.sql file in `packages/database/src/migrations/` in lexical
# order against it. A single failed apply fails the job — earlier migrations
# break later ones, so the whole chain is the unit of correctness.
#
# DB image rationale (must mirror Supabase prod = PG17.6 + pgvector + postgis):
#   The previous vanilla `postgres:17` service container shipped NEITHER
#   pgvector NOR postgis, so every vector-typed migration (0285/0286/0288/
#   0313) hard-failed with `type "vector" does not exist`, and the postgis
#   baseline (CREATE EXTENSION postgis) failed too. There is no single
#   official image at PG17 carrying both extensions, so we runner-install
#   from the PostgreSQL APT repository (PGDG):
#     postgresql-17 + postgresql-17-postgis-3 + postgresql-17-pgvector
#   This matches Supabase, which ships both extensions natively, and is kept
#   in lockstep with the sibling migration-apply-fresh.yml.
#
# This workflow is the runtime complement to:
#   - .github/workflows/db-migrations-check.yml — destructive-statement lint
#     and a less-strict dry-run path used by the legacy pipeline.
#   - scripts/validate-migration-safety.mjs — static NOT NULL backfill +
#     DROP/TRUNCATE/CREATE INDEX dangerous-pattern detection.
#
# Together they form the migration CI gate: lint -> static safety pass ->
# runtime apply. A migration MUST pass all three before it can merge.
#
# Trigger:
#   - PR: every migration / schema change
#   - push to main: belt-and-braces guard for direct main commits
# =============================================================================

name: Migration Apply Check

on:
  pull_request:
    paths:
      - 'packages/database/src/migrations/**'
      - 'packages/database/src/schemas/**'
      - 'scripts/migration-apply-check.mjs'
      - 'scripts/validate-migration-safety.mjs'
      - '.github/workflows/migration-apply-check.yml'
  push:
    branches: [main]
    paths:
      - 'packages/database/src/migrations/**'
      - 'packages/database/src/schemas/**'
  workflow_dispatch:

concurrency:
  group: migration-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-all-migrations:
    name: Apply every migration in order against Postgres 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://bossnyumba:bossnyumba@localhost:5432/bossnyumba_migration_check
      # The apply-check script's defaults match the production layout —
      # we set MIGRATIONS_DIR explicitly so a path rename can't silently
      # cause the job to scan the wrong directory and report zero failures.
      MIGRATIONS_DIR: packages/database/src/migrations
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Runner-installed Postgres 17 with BOTH PostGIS and pgvector. The
      # previous vanilla `postgres:17` service container shipped neither, so
      # the postgis baseline (CREATE EXTENSION postgis) and every vector-typed
      # migration (0285/0286/0288/0313) cascaded into failure. This mirrors
      # the sibling migration-apply-fresh.yml (and Supabase, which ships both
      # extensions natively).
      - name: Install + start PostgreSQL 17 + PostGIS + pgvector (PGDG)
        run: |
          set -e
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-17-postgis-3 postgresql-17-pgvector
          sudo systemctl stop postgresql 2>/dev/null || true
          for v in 16 17; do sudo pg_dropcluster --stop "$v" main 2>/dev/null || true; done
          sudo pg_createcluster 17 main -p 5432 -- --auth-local=trust --auth-host=trust
          sudo pg_ctlcluster 17 main start
          for i in $(seq 1 30); do sudo -u postgres pg_isready -p 5432 >/dev/null 2>&1 && break; sleep 1; done
          sudo -u postgres psql -p 5432 -v ON_ERROR_STOP=1 -c "CREATE ROLE bossnyumba LOGIN SUPERUSER PASSWORD 'bossnyumba'"
          sudo -u postgres psql -p 5432 -v ON_ERROR_STOP=1 -c "CREATE DATABASE bossnyumba_migration_check OWNER bossnyumba"
          echo "PostgreSQL 17 + PostGIS + pgvector ready on :5432"

      - name: Try CREATE EXTENSION vector + postgis (best-effort)
        run: |
          for ext in vector postgis postgis_topology pgcrypto "uuid-ossp" pg_trgm citext btree_gist; do
            PGPASSWORD=bossnyumba psql -h localhost -p 5432 -U bossnyumba -d bossnyumba_migration_check \
              -c "CREATE EXTENSION IF NOT EXISTS \"${ext}\"" 2>&1 | tail -1 || \
              echo "::warning::extension ${ext} not available"
          done

      - name: Seed Supabase roles (authenticated, anon, service_role)
        # Supabase Postgres provisions these roles at cluster init time. CI's
        # fresh cluster has none of them — so every RLS migration since 0155
        # (CREATE POLICY ... TO authenticated, GRANT ... TO anon) explodes
        # with `role "authenticated" does not exist`. Create them idempotently
        # before applying any migration so the fresh-DB run mirrors production.
        # NOLOGIN matches the Supabase convention — these are JWT-claim
        # aliases, never login users.
        env:
          PGPASSWORD: bossnyumba
        run: |
          psql -h localhost -p 5432 -U bossnyumba -d bossnyumba_migration_check <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          SQL

      - name: Apply all migrations against fresh Postgres
        # Drives `scripts/migration-apply-check.mjs` which iterates every
        # *.sql file in lex order, wrapping each in a transaction via
        # `psql -v ON_ERROR_STOP=1`. The script writes a markdown report
        # to .audit/migration-apply.md that captures the first ERROR
        # line per failed file for fast triage.
        env:
          PGPASSWORD: bossnyumba
        run: |
          node scripts/migration-apply-check.mjs \
            --migrations-dir="${MIGRATIONS_DIR}" \
            --db-url="${DATABASE_URL}" \
            --enable-vector=true \
            --report=.audit/migration-apply.md

      - name: Smoke query — verify public schema landed
        # Belt-and-braces: list 5 public tables so the job log shows the
        # schema actually shaped after the apply. Empty output means the
        # apply silently no-op'd and we should hard-fail.
        run: |
          set -e
          ROWS=$(PGPASSWORD=bossnyumba psql -h localhost -p 5432 -U bossnyumba -d bossnyumba_migration_check -tA \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' LIMIT 5")
          if [ -z "$ROWS" ]; then
            echo "::error::Smoke query returned zero rows — public schema did not materialize"
            exit 1
          fi
          echo "Sample tables in public schema:"
          echo "$ROWS"

      - name: Upload migration-apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-apply-report
          path: .audit/migration-apply.md
          if-no-files-found: warn

  validate-migration-safety:
    name: Lint dangerous patterns in new migrations
    runs-on: ubuntu-latest
    # Runs in parallel with the apply check — the safety lint catches
    # patterns the apply check might not surface against an empty DB
    # (e.g. NOT NULL backfill hazards on tables that don't have rows in
    # CI but will in production), plus DROP / TRUNCATE / blocking-index
    # patterns that would break production.
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so the --since-ref diff works against the
          # PR base. The lint scopes its new dangerous-pattern detectors
          # to changed files only; legacy migrations are not re-scored.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run migration safety lint
        env:
          # On PRs, scope to files changed vs the PR base; on push to
          # main, scope to the previous commit so the gate ratchets
          # forward without re-flagging legacy migrations.
          SINCE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'HEAD~1' }}
        run: |
          node scripts/validate-migration-safety.mjs \
            --migrations-dir=packages/database/src/migrations \
            --since-ref="${SINCE_REF}" \
            --fail-on=fail \
            --output=markdown \
            --report=.audit/migration-safety.md
      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-safety-report
          path: .audit/migration-safety.md
          if-no-files-found: warn
