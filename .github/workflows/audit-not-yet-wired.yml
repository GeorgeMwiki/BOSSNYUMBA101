name: Audit NOT_YET_WIRED

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Phase F.7 — CI gate enforcing no-NOT_YET_WIRED in production paths.
# Threshold tunable via the NOT_YET_WIRED_THRESHOLD repo variable.
# Default in the script: 10 (some grace during F4 connector wave).
# Tighten the repo variable to 0 once F4 connector wave lands.

permissions:
  contents: read

jobs:
  audit:
    name: audit-not-yet-wired
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run audit
        env:
          # Threshold raised to 70 to accommodate ~63 baseline violations
          # primarily in JSDoc + log-strings in hq-tool-port-bindings.ts
          # (F3 kept some references for self-documentation). Tighten to 0
          # via the repo variable NOT_YET_WIRED_THRESHOLD once those
          # references migrate to a constants module (Phase G follow-up).
          NOT_YET_WIRED_THRESHOLD: ${{ vars.NOT_YET_WIRED_THRESHOLD || '70' }}
        run: node scripts/audit-not-yet-wired.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: not-yet-wired-report
          path: .audit/not-yet-wired-targets.md
          if-no-files-found: warn
