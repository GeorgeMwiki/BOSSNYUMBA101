# =============================================================================
# Semgrep static analysis
# =============================================================================
# SAST. The repo ships custom rules (`.semgrep/bossnyumba-rules.yml`, e.g.
# tenant-scoped-repository enforcement, raw-error-envelope, pii-in-log) but the
# generic registry ruleset is the only thing uploaded to GitHub code-scanning.
#
# This uploads a `p/security-audit` SARIF to code-scanning (visibility,
# non-blocking) AND runs the BOSSNYUMBA custom rules as a SEPARATE advisory step
# that never enters the uploaded SARIF — matching the repo's documented
# "custom rules are advisory regression detectors" convention (see
# `.semgrep/bossnyumba-rules.yml`), so the code-scanning gate ("Semgrep OSS")
# never red-floods on advisory custom-rule findings.
#
# To run locally:
#   pip install semgrep
#   semgrep scan --config=.semgrep/bossnyumba-rules.yml packages/ services/ apps/
#
# Custom rule philosophy: catch BOSSNYUMBA-specific regressions that generic
# rulesets miss (cross-tenant lookups, raw error envelopes, unbounded findMany,
# PII in logs). See `.semgrep/bossnyumba-rules.yml` for full inventory.
# =============================================================================

name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # weekly Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install semgrep

      - name: Scan → SARIF (registry rules; non-blocking visibility)
        run: |
          semgrep scan \
            --config p/security-audit \
            --sarif --output semgrep.sarif \
            --metrics off || true
          # Guarantee a SARIF exists so the upload step never hard-fails even
          # if the scan above errored before writing output.
          [ -f semgrep.sarif ] || printf '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > semgrep.sarif

      - name: Upload SARIF to code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # NOTE: `.semgrep/bossnyumba-rules.yml` findings are advisory regression
      # detectors (as-any-cast, raw-error-response, pii-in-log, etc.). They are
      # NOT uploaded to code-scanning — they would otherwise red-flood the
      # "Semgrep OSS" PR gate with documented false-positive classes. This step
      # surfaces them as CI annotations only and never blocks the merge; promote
      # an individual rule to a hard gate by moving it into a dedicated --error
      # step once its false-positive rate is at zero.
      - name: BOSSNYUMBA custom-rule scan (advisory; not uploaded to code-scanning)
        run: |
          semgrep scan \
            --config .semgrep/bossnyumba-rules.yml \
            --metrics off \
            || echo "::warning title=semgrep custom-rule findings::.semgrep/bossnyumba-rules.yml reported advisory findings; review CI annotations. These do not block merge."
