<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BossNyumba logomark for LIGHT surfaces — bare doorway-B in deep
       burnished bronze for contrast on cream/white, transparent
       background. The arched doorway reads as cream showing through.
       Same geometry as <BossNyumbaMark />, deeper colour ramp. -->
  <defs>
    <linearGradient id="spine" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A36A2A"/><stop offset="55%" stop-color="#7A4F1E"/><stop offset="100%" stop-color="#4A2F0E"/>
    </linearGradient>
    <linearGradient id="upper" x1="32" y1="14" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8873E"/><stop offset="100%" stop-color="#7A4F1E"/>
    </linearGradient>
    <linearGradient id="lower" x1="32" y1="34" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8F5A21"/><stop offset="100%" stop-color="#4A2F0E"/>
    </linearGradient>
  </defs>

  <rect x="14" y="12" width="8" height="40" rx="2" fill="url(#spine)"/>
  <path d="M22 14 H38 a8 8 0 0 1 8 8 v3 a8 8 0 0 1 -8 8 H22 z" fill="url(#upper)"/>
  <rect x="22" y="32" width="20" height="1.2" fill="#7A4F1E" opacity="0.9"/>
  <path fill-rule="evenodd" clip-rule="evenodd" d="M22 35 H40 a10 10 0 0 1 10 10 a10 10 0 0 1 -10 10 H22 Z M31.6 55 V49 a3.9 3.9 0 0 1 7.8 0 V55 Z" fill="url(#lower)"/>
</svg>
